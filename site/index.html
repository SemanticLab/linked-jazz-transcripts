<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jazz Oral Histories — Transcript Reader</title>
<style>
:root {
  --bg: #16161a; --panel: #1f1f24; --ink: #e8e6e1; --muted: #9a978f;
  --accent: #e8a33d; --accent2: #6db3f2; --line: #2e2e35; --hl: #3a3120;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
#wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 80px; }
header.doc { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
header.doc h1 { font-size: 22px; margin: 4px 0 8px; line-height: 1.3; }
.crumbs { font-size: 13px; color: var(--muted); }
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 6px; }
.meta b { color: var(--ink); font-weight: 600; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 9px;
         background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.srclink { margin-top: 10px; font-size: 14px; }
.turn { display: grid; grid-template-columns: 168px 1fr; gap: 14px; padding: 7px 8px;
        border-radius: 6px; scroll-margin-top: 90px; }
.turn .spk { font-size: 13px; font-weight: 600; color: var(--muted); text-align: right;
             padding-top: 2px; overflow-wrap: break-word; }
.turn.iv .spk { color: var(--accent); }
.turn.ir .spk { color: var(--accent2); }
.turn .tx { white-space: pre-wrap; overflow-wrap: break-word; }
.turn.hl { background: var(--hl); outline: 1px solid #6b5a2a; }
.turn.hlseg { background: var(--hl); }
.seghead { margin: 26px 0 8px; padding: 6px 0 4px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.seghead .segchap { text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-right: 10px; }
.seghead .segtitle { color: var(--accent2); font-size: 14px; }
.seghead .segper { margin-left: 10px; font-size: 12px; }
.seghead.hl { color: var(--accent); }
.pagesep { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 2px;
           margin: 18px 0 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
/* directory */
#q { width: 100%; padding: 10px 14px; font-size: 16px; border-radius: 8px;
     border: 1px solid var(--line); background: var(--panel); color: var(--ink); margin: 14px 0 4px; }
#q:focus { outline: 1px solid var(--accent2); }
.row { display: flex; gap: 12px; align-items: baseline; padding: 7px 8px;
       border-bottom: 1px solid var(--line); }
.row .y { color: var(--muted); font-size: 13px; min-width: 42px; }
.row .c { margin-left: auto; }
#count { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
#topbar { position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
          backdrop-filter: blur(6px); padding: 10px 0; font-size: 14px; z-index: 5;
          border-bottom: 1px solid var(--line); margin-bottom: 8px; display: none; }
@media (max-width: 640px) {
  .turn { grid-template-columns: 1fr; gap: 2px; }
  .turn .spk { text-align: left; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar"><a href="./">← all transcripts</a></div>
  <div id="app">loading…</div>
</div>
<script src="app.js"></script>
</body>
</html>
