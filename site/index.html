<link rel="stylesheet" href="tokens.css">

<script>
  // apply a remembered theme before first paint; otherwise the system preference applies
  try { var t = localStorage.getItem("lj-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<header class="lj-header">
  <a class="lj-brand" href="./"><img src="assets/linked-jazz-mark.png" alt="">Linked Jazz</a>
  <nav aria-label="Main">
    <ul class="lj-nav">
      <li><a href="https://thisismattmiller.github.io/linked-jazz-2026-network/">People</a></li>
      <li><a href="./" aria-current="page">Oral histories</a></li>
      <li><a href="https://linkedjazz.org/">About</a></li>
    </ul>
  </nav>
  <form class="lj-search" role="search" action="./" method="get" id="hsearch" hidden>
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3.75a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5Zm3.75 9 3.5 3.5"/></svg>
    <input type="search" name="q" placeholder="Search the transcripts" aria-label="Search the transcripts" autocomplete="off" spellcheck="false">
  </form>
  <button class="lj-btn lj-btn-sm theme" type="button" id="theme" aria-pressed="false">Dark theme</button>
</header>
<main>
  <div id="app"><p class="status">Loading…</p></div>
</main>
<script src="app.js"></script>
